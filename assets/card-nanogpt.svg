<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 306" width="520" height="306" role="img" aria-label="Story Generation with nanoGPT">
<style>
.t{font-family:ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes dash{to{stroke-dashoffset:-44}}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(62px)}100%{transform:translateY(0)}}
@keyframes ping{0%,100%{opacity:.15}50%{opacity:.6}}
.pop{animation:pop .5s ease-out both}
.dash{animation:dash 2.4s linear infinite}
.scan{animation:scan 3.2s ease-in-out infinite}
.ping{animation:ping 2.6s ease-in-out infinite}
</style>
