<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 306" width="520" height="306" role="img" aria-label="TokenEater, multi-account fork">
<style>
.t{font-family:ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes dash{to{stroke-dashoffset:-44}}
@keyframes ping{0%,100%{opacity:.15}50%{opacity:.6}}
.pop{animation:pop .5s ease-out both}
.dash{animation:dash 2.4s linear infinite}
.ping{animation:ping 2.6s ease-in-out infinite}
</style>
<rect x="1" y="1" width="518" height="304" rx="12" fill="#010203" stroke="#10241a"/>
<rect x="1" y="1" width="518" height="3" rx="1.5" fill="#00ff41" opacity=".55"/>
<rect x="22" y="20" width="34" height="34" rx="9" fill="#00ff41"/>
<g transform="translate(27,25) scale(0.83)"><path d="M4 6h16M4 12h16M4 18h10" fill="none" stroke="#010203" stroke-width="2.1" stroke-linecap="round"/></g>
<text class="t" x="68" y="36" font-size="14.5" fill="#d8e4dc" font-weight="600">TokenEater &#183; Multi-Account Fork</text>
<text class="t" x="68" y="51" font-size="9" fill="#7d8f85" letter-spacing="1.1">SWIFT &#183; SWIFTUI &#183; MACOS MENU BAR</text>
<rect x="22" y="68" width="476" height="132" rx="8" fill="#0a0f0c" stroke="#10241a"/>
<clipPath id="c"><rect x="22" y="68" width="476" height="132" rx="8"/></clipPath>
<g clip-path="url(#c)"><g transform="translate(22,68)"><rect x="0" y="34" width="476" height="58" fill="#0d1a12"/><text class="t" x="26" y="67" font-size="12" fill="#7d8f85">&#9655;  &#8776;</text><rect x="96" y="50" width="64" height="26" rx="13" fill="#00ff41" fill-opacity=".14" stroke="#00ff41" stroke-opacity=".7"/><text class="t" x="128.0" y="67.5" font-size="12" font-weight="700" fill="#00ff41" text-anchor="middle">13%</text><rect x="168" y="50" width="56" height="26" rx="13" fill="#00ff41" fill-opacity=".14" stroke="#00ff41" stroke-opacity=".7"/><text class="t" x="196.0" y="67.5" font-size="12" font-weight="700" fill="#00ff41" text-anchor="middle">9%</text><rect x="238" y="54" width="1" height="18" fill="#7d8f85" opacity=".6"/><g class="pop" style="animation-delay:.4s"><rect x="252" y="50" width="78" height="26" rx="13" fill="#00e5ff" fill-opacity=".14" stroke="#00e5ff" stroke-opacity=".7"/><text class="t" x="291.0" y="67.5" font-size="12" font-weight="700" fill="#00e5ff" text-anchor="middle">W 4%</text><rect x="338" y="50" width="88" height="26" rx="13" fill="#00e5ff" fill-opacity=".14" stroke="#00e5ff" stroke-opacity=".7"/><text class="t" x="382.0" y="67.5" font-size="12" font-weight="700" fill="#00e5ff" text-anchor="middle">W 24%</text></g><text class="t" x="96" y="112" font-size="9.5" fill="#7d8f85">personal</text><text class="t ping" x="252" y="112" font-size="9.5" fill="#00e5ff">+ second Claude account</text></g></g>
<text class="t" x="22" y="224" font-size="11.5" fill="#9fb3a8">A fork of a macOS Claude usage tracker that adds a second Claude</text><text class="t" x="22" y="242" font-size="11.5" fill="#9fb3a8">account as a provider of its own: menu bar, popover, dashboard</text><text class="t" x="22" y="260" font-size="11.5" fill="#9fb3a8">and Studio, in the app&#8217;s own design. Proposed upstream as #284.</text>
<line x1="22" y1="272" x2="498" y2="272" stroke="#10241a"/>
<text class="t" x="22" y="291" font-size="10.5" fill="#00ff41" opacity=".85">&#8250; github.com/Mayukh-D/TokenEater</text>
