<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 306" width="520" height="306" role="img" aria-label="SiteViews, total website views in the Mac menu bar">
<style>
.t{font-family:ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
@keyframes a{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes b{0%,45%{opacity:0}50%,95%{opacity:1}100%{opacity:0}}
@keyframes ping{0%,45%{opacity:0}50%{opacity:1}70%,100%{opacity:0}}
.n1{animation:a 6s steps(1) infinite}
.n2{animation:b 6s steps(1) infinite}
.p{animation:ping 6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.n1,.n2,.p{animation:none}.n1{opacity:0}}
</style>
