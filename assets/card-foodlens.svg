<text class="t" x="22" y="224" font-size="11.5" fill="#9fb3a8">A progressive web app for sustainable shopping: real-time barcode</text><text class="t" x="22" y="242" font-size="11.5" fill="#9fb3a8">scanning, live product lookup, allergen, expiry and carbon flagging,</text><text class="t" x="22" y="260" font-size="11.5" fill="#9fb3a8">with A/B interaction logging for HCI research.</text>
