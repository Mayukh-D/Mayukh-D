<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 306" width="520" height="306" role="img" aria-label="Yuma Social Platform">
<style>
.t{font-family:ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
@keyframes pop{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes dash{to{stroke-dashoffset:-44}}
@keyframes scan{0%{transform:translateY(0)}50%{transform:translateY(62px)}100%{transform:translateY(0)}}
@keyframes ping{0%,100%{opacity:.15}50%{opacity:.6}}
.pop{animation:pop .5s ease-out both}
.dash{animation:dash 2.4s linear infinite}
.scan{animation:scan 3.2s ease-in-out infinite}
.ping{animation:ping 2.6s ease-in-out infinite}
</style>
<rect x="1" y="1" width="518" height="304" rx="12" fill="#010203" stroke="#10241a"/>
<rect x="1" y="1" width="518" height="3" rx="1.5" fill="#00ff41" opacity=".55"/>
<rect x="22" y="20" width="34" height="34" rx="9" fill="#00ff41"/>
<g transform="translate(27,25) scale(0.83)"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-5.1A8 8 0 1 1 21 12z" fill="none" stroke="#010203" stroke-width="2" stroke-linejoin="round"/></g>
<text class="t" x="68" y="36" font-size="14.5" fill="#d8e4dc" font-weight="600">Yuma Social Platform</text>
<text class="t" x="68" y="51" font-size="9" fill="#7d8f85" letter-spacing="1.1">JAVA &#183; ANDROID &#183; DESIGN PATTERNS</text>
<rect x="22" y="68" width="476" height="132" rx="8" fill="#0a0f0c" stroke="#10241a"/>
<clipPath id="c"><rect x="22" y="68" width="476" height="132" rx="8"/></clipPath>
<g clip-path="url(#c)"><g transform="translate(22,68)"><rect x="34" y="14" width="86" height="106" rx="10" fill="#0d1a12" stroke="#1d4a2f"/><rect x="60" y="20" width="34" height="4" rx="2" fill="#1d4a2f"/><rect class="pop" x="42" y="34" width="52" height="18" rx="6" fill="#0f2419" style="animation-delay:0.00s"/><rect x="49" y="40" width="32" height="2.5" rx="1.2" fill="#d8e4dc" opacity=".55"/><rect x="49" y="45" width="22" height="2.5" rx="1.2" fill="#d8e4dc" opacity=".35"/><rect class="pop" x="74" y="60" width="44" height="18" rx="6" fill="#00ff41" style="animation-delay:0.14s"/><rect x="81" y="66" width="24" height="2.5" rx="1.2" fill="#010203" opacity=".55"/><rect x="81" y="71" width="14" height="2.5" rx="1.2" fill="#010203" opacity=".35"/><rect class="pop" x="42" y="86" width="58" height="18" rx="6" fill="#0f2419" style="animation-delay:0.28s"/><rect x="49" y="92" width="38" height="2.5" rx="1.2" fill="#d8e4dc" opacity=".55"/><rect x="49" y="97" width="28" height="2.5" rx="1.2" fill="#d8e4dc" opacity=".35"/><rect x="150" y="20" width="8" height="8" rx="2" fill="#00e5ff" opacity=".8"/><text class="t" x="168" y="28" font-size="10.5" fill="#d8e4dc">Singleton</text><text class="t" x="270" y="28" font-size="10.5" fill="#7d8f85">session + auth</text><rect x="150" y="44" width="8" height="8" rx="2" fill="#00e5ff" opacity=".8"/><text class="t" x="168" y="52" font-size="10.5" fill="#d8e4dc">Factory</text><text class="t" x="270" y="52" font-size="10.5" fill="#7d8f85">post &amp; reaction types</text><rect x="150" y="68" width="8" height="8" rx="2" fill="#00e5ff" opacity=".8"/><text class="t" x="168" y="76" font-size="10.5" fill="#d8e4dc">Iterator</text><text class="t" x="270" y="76" font-size="10.5" fill="#7d8f85">feed traversal</text><rect x="150" y="92" width="8" height="8" rx="2" fill="#00e5ff" opacity=".8"/><text class="t" x="168" y="100" font-size="10.5" fill="#d8e4dc">DAO</text><text class="t" x="270" y="100" font-size="10.5" fill="#7d8f85">layered persistence</text></g></g>
<text class="t" x="22" y="224" font-size="11.5" fill="#9fb3a8">A native Android social app: post feed, reactions, direct messages</text><text class="t" x="22" y="242" font-size="11.5" fill="#9fb3a8">and admin moderation, built on Singleton, Factory and Iterator</text><text class="t" x="22" y="260" font-size="11.5" fill="#9fb3a8">patterns over a layered DAO architecture.</text>
