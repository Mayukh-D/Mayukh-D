<g class="card" style="animation-delay:0.00s"><rect x="64" y="78" width="930" height="184" rx="8" fill="#0a0f0c" stroke="#1d4a2f"/><rect x="64" y="78" width="3" height="184" rx="1.5" fill="#00ff41"/><text class="t" x="84" y="106" font-size="18" font-weight="700" fill="#00ff41">Haizea Analytics</text><text class="t" x="974" y="106" font-size="12" fill="#00ff41" text-anchor="end">Sep 2026 – Present</text><text class="t" x="84" y="126" font-size="10" fill="#7d8f85" letter-spacing="1.1">SATELLITE AI RESEARCH TRAINEE · CANBERRA</text><text class="t" x="84" y="154" font-size="12" fill="#00ff41">&#8250;</text><text class="t" x="100" y="154" font-size="12" fill="#d8e4dc">Deep learning models that map live tree canopy cover across Australia at 10 m</text><text class="t" x="100" y="170" font-size="12" fill="#d8e4dc">from four years of quarterly Sentinel-2 imagery, trained on airborne LiDAR.</text><text class="t" x="84" y="194" font-size="12" fill="#00ff41">&#8250;</text><text class="t" x="100" y="194" font-size="12" fill="#d8e4dc">Run as pre-registered, multi-seed experiments where every change has to beat</text><text class="t" x="100" y="210" font-size="12" fill="#d8e4dc">the noise floor.</text><rect x="84" y="224" width="62" height="20" rx="4" fill="#010203" stroke="#1d4a2f"/><text class="t" x="115" y="238" font-size="10.5" fill="#00ff41" text-anchor="middle">PyTorch</text><rect x="154.45" y="224" width="82" height="20" rx="4" fill="#010203" stroke="#1d4a2f"/><text class="t" x="195" y="238" font-size="10.5" fill="#00ff41" text-anchor="middle">Sentinel-2</text><rect x="243.95" y="224" width="50" height="20" rx="4" fill="#010203" stroke="#1d4a2f"/><text class="t" x="269" y="238" font-size="10.5" fill="#00ff41" text-anchor="middle">LiDAR</text><rect x="301.7" y="224" width="107" height="20" rx="4" fill="#010203" stroke="#1d4a2f"/><text class="t" x="355" y="238" font-size="10.5" fill="#00ff41" text-anchor="middle">Remote sensing</text></g><g class="card" style="animation-delay:0.12s"><rect x="64" y="278" width="930" height="224" rx="8" fill="#0a0f0c" stroke="#1d4a2f"/><rect x="64" y="278" width="3" height="224" rx="1.5" fill="#00ff41"/><text class="t" x="84" y="306" font-size="18" font-weight="700" fill="#00ff41">Eccoi</text><text class="t" x="974" y="306" font-size="12" fill="#00ff41" text-anchor="end">Jul 2026 – Present</text><text class="t" x="84" y="326" font-size="10" fill="#7d8f85" letter-spacing="1.1">TRAINEE ML ARCHITECT AND SYSTEM ENGINEER · CANBERRA</text><text class="t" x="84" y="354" font-size="12" fill="#00ff41">&#8250;</text><text class="t" x="100" y="354" font-size="12" fill="#d8e4dc">Architecting <tspan fill="#00ff41" font-weight="700">SAICOP</tspan>, Eccoi's Sovereign AI Community of Practice: architectural</text><text class="t" x="100" y="370" font-size="12" fill="#d8e4dc">principles, the system context model, and platform assessment and shortlisting.</text><text class="t" x="84" y="394" font-size="12" fill="#00ff41">&#8250;</text><text class="t" x="100" y="394" font-size="12" fill="#d8e4dc">Proving the conceptual architecture end to end against Australian Government</text><text class="t" x="100" y="410" font-size="12" fill="#d8e4dc">delivery, security and procurement realities.</text><text class="t" x="84" y="434" font-size="12" fill="#00ff41">&#8250;</text><text class="t" x="100" y="434" font-size="12" fill="#d8e4dc">Exhibited SAICOP at the Inaugural Australian AI Parliamentary Showcase,</text><text class="t" x="100" y="450" font-size="12" fill="#d8e4dc">Parliament House, Sep 2026.</text><rect x="84" y="464" width="151" height="20" rx="4" fill="#010203" stroke="#1d4a2f"/><text class="t" x="160" y="478" font-size="10.5" fill="#00ff41" text-anchor="middle">Solution architecture</text><rect x="243.35" y="464" width="170" height="20" rx="4" fill="#010203" stroke="#1d4a2f"/><text class="t" x="329" y="478" font-size="10.5" fill="#00ff41" text-anchor="middle">System context modelling</text><rect x="421.75" y="464" width="139" height="20" rx="4" fill="#010203" stroke="#1d4a2f"/><text class="t" x="491" y="478" font-size="10.5" fill="#00ff41" text-anchor="middle">Platform assessment</text><rect x="568.4" y="464" width="94" height="20" rx="4" fill="#010203" stroke="#1d4a2f"/><text class="t" x="616" y="478" font-size="10.5" fill="#00ff41" text-anchor="middle">Sovereign AI</text></g><g class="card" style="animation-delay:0.24s"><rect x="64" y="518" width="930" height="208" rx="8" fill="#0a0f0c" stroke="#123a40"/><rect x="64" y="518" width="3" height="208" rx="1.5" fill="#00e5ff"/><text class="t" x="84" y="546" font-size="18" font-weight="700" fill="#00e5ff">Accenture</text><text class="t" x="974" y="546" font-size="12" fill="#00e5ff" text-anchor="end">Jan 2022 – Feb 2025</text><text class="t" x="84" y="566" font-size="10" fill="#7d8f85" letter-spacing="1.1">ADVANCED APPLICATION ENGINEERING ANALYST · BENGALURU</text><text class="t" x="84" y="594" font-size="12" fill="#00e5ff">&#8250;</text><text class="t" x="100" y="594" font-size="12" fill="#d8e4dc">Built <tspan fill="#00e5ff" font-weight="700">Ingrain</tspan>, an AIOps tool that generates predictive ML pipelines for automated IT ticket resolution,</text><text class="t" x="100" y="610" font-size="12" fill="#d8e4dc">with explainable AI and live model-performance reporting.</text><text class="t" x="84" y="634" font-size="12" fill="#00e5ff">&#8250;</text><text class="t" x="100" y="634" font-size="12" fill="#d8e4dc">Built <tspan fill="#00e5ff" font-weight="700">Quasar++</tspan>, a chatbot for querying internal documents through the ChatGPT API.</text><text class="t" x="84" y="658" font-size="12" fill="#00e5ff">&#8250;</text><text class="t" x="100" y="658" font-size="12" fill="#d8e4dc">Production backend and data work: MERN stack services, MLOps pipelines, and a data</text><text class="t" x="100" y="674" font-size="12" fill="#d8e4dc">engineering stack of Hadoop, PySpark and Cassandra.</text><rect x="84" y="688" width="43" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="106" y="702" font-size="10.5" fill="#00e5ff" text-anchor="middle">MERN</text><rect x="135.4" y="688" width="50" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="160" y="702" font-size="10.5" fill="#00e5ff" text-anchor="middle">MLOps</text><rect x="193.15" y="688" width="56" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="221" y="702" font-size="10.5" fill="#00e5ff" text-anchor="middle">Hadoop</text><rect x="257.25" y="688" width="62" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="288" y="702" font-size="10.5" fill="#00e5ff" text-anchor="middle">PySpark</text><rect x="327.7" y="688" width="75" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="365" y="702" font-size="10.5" fill="#00e5ff" text-anchor="middle">Cassandra</text><rect x="410.85" y="688" width="107" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="464" y="702" font-size="10.5" fill="#00e5ff" text-anchor="middle">Explainable AI</text><rect x="525.75" y="688" width="88" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="570" y="702" font-size="10.5" fill="#00e5ff" text-anchor="middle">ChatGPT API</text></g><g class="card" style="animation-delay:0.36s"><rect x="64" y="742" width="930" height="144" rx="8" fill="#0a0f0c" stroke="#123a40"/><rect x="64" y="742" width="3" height="144" rx="1.5" fill="#00e5ff"/><text class="t" x="84" y="770" font-size="18" font-weight="700" fill="#00e5ff">Cognizant</text><text class="t" x="974" y="770" font-size="12" fill="#00e5ff" text-anchor="end">Oct 2021 – Jan 2022</text><text class="t" x="84" y="790" font-size="10" fill="#7d8f85" letter-spacing="1.1">PROGRAMMER ANALYST · INDIA</text><text class="t" x="84" y="818" font-size="12" fill="#00e5ff">&#8250;</text><text class="t" x="100" y="818" font-size="12" fill="#d8e4dc">Full-stack .NET MVC systems with React front ends and SQL Server, including a Hospital Logistics</text><text class="t" x="100" y="834" font-size="12" fill="#d8e4dc">System for COVID-19 operational workflows.</text><rect x="84" y="848" width="69" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="118" y="862" font-size="10.5" fill="#00e5ff" text-anchor="middle">.NET MVC</text><rect x="160.8" y="848" width="50" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="186" y="862" font-size="10.5" fill="#00e5ff" text-anchor="middle">React</text><rect x="218.55" y="848" width="82" height="20" rx="4" fill="#010203" stroke="#123a40"/><text class="t" x="259" y="862" font-size="10.5" fill="#00e5ff" text-anchor="middle">SQL Server</text></g>
<text class="t" x="26" y="914" font-size="11" fill="#7d8f85"># the repos here are mostly ML and research; the production backend side lives in the work above.</text>
