<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 306" width="520" height="306" role="img" aria-label="Lantern, screen sync for a cheap LED bar">
<style>
.t{font-family:ui-monospace,'JetBrains Mono','SF Mono',SFMono-Regular,Menlo,Consolas,monospace}
@keyframes hue{0%,20%{fill:#ff8a3d}33%,53%{fill:#3dff7a}66%,86%{fill:#c9d4ff}100%{fill:#ff8a3d}}
@keyframes glow{0%,20%{fill:#ff8a3d}33%,53%{fill:#3dff7a}66%,86%{fill:#c9d4ff}100%{fill:#ff8a3d}}
.c{animation:hue 9s ease-in-out infinite}
.g{animation:glow 9s ease-in-out infinite;opacity:.18}
</style>
<defs><filter id="b" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="14"/></filter></defs>
<rect x="1" y="1" width="518" height="304" rx="12" fill="#010203" stroke="#10241a"/>
<rect x="1" y="1" width="518" height="3" rx="1.5" fill="#00ff41" opacity=".55"/>
<rect x="22" y="20" width="34" height="34" rx="9" fill="#00ff41"/>
<rect x="34" y="26" width="5" height="22" rx="2.5" fill="#010203"/><rect x="42" y="36" width="9" height="7" rx="1.5" fill="#010203"/>
<text class="t" x="68" y="36" font-size="14.5" fill="#d8e4dc" font-weight="600">Lantern &#183; Screen Sync for a A$49 Light</text>
<text class="t" x="68" y="51" font-size="9" fill="#7d8f85" letter-spacing="1.1">SWIFT &#183; SWIFTUI &#183; BLUETOOTH LE</text>
<rect x="22" y="68" width="476" height="132" rx="8" fill="#0a0f0c" stroke="#10241a"/>
<clipPath id="c"><rect x="22" y="68" width="476" height="132" rx="8"/></clipPath>
<g clip-path="url(#c)"><g transform="translate(22,68)">
  <ellipse class="g" cx="120" cy="66" rx="70" ry="80" filter="url(#b)"/>
  <rect class="c" x="114" y="12" width="12" height="108" rx="6"/>
  <rect x="200" y="34" width="120" height="70" rx="6" fill="#1a2420"/>
  <rect class="c" x="206" y="40" width="108" height="58" rx="3"/>
  <rect x="246" y="104" width="28" height="6" rx="2" fill="#1a2420"/>
  <text class="t" x="350" y="54" font-size="10" fill="#7d8f85">Hue setup</text>
  <text class="t" x="350" y="70" font-size="13" fill="#9fb3a8" text-decoration="line-through">&#8776; A$550</text>
  <text class="t" x="350" y="92" font-size="10" fill="#7d8f85">this</text>
  <text class="t" x="350" y="108" font-size="13" font-weight="700" fill="#00ff41">A$49</text>
</g></g>
<text class="t" x="22" y="224" font-size="11.5" fill="#9fb3a8">A Mac menu bar app that makes a cheap Bluetooth LED bar follow</text><text class="t" x="22" y="242" font-size="11.5" fill="#9fb3a8">the screen, Hue-style. Reverse-engineered the light&#8217;s protocol,</text><text class="t" x="22" y="260" font-size="11.5" fill="#9fb3a8">calibrated LED colour by eye, shipped with a site and release.</text>
<line x1="22" y1="272" x2="498" y2="272" stroke="#10241a"/>
<text class="t" x="22" y="291" font-size="10.5" fill="#00ff41" opacity=".85">&#8250; github.com/Mayukh-D/lantern</text>
</svg>
