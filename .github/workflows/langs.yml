name: refresh language panel

on:
  schedule:
    - cron: "17 22 * * *"   # daily, 22:17 UTC (after the site's Scholar refresh at 21:41)
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/gen_langs.py"
      - ".github/scripts/gen_metrics.py"
      - ".github/workflows/langs.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate assets/langs.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gen_langs.py assets/langs.svg

      - name: Regenerate assets/metrics.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/gen_metrics.py assets/metrics.svg

      - name: Commit if changed
        run: |
          # The panels carry today's date, so ignore a change to that line alone.
          if [ -z "$(git diff -U0 -- assets/langs.svg assets/metrics.svg | grep '^[+-][^+-]' | grep -v 'updated ')" ]; then
            echo "no change"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: refresh language and metrics panels"
          git push
